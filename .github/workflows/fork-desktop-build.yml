name: Fork Desktop test installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            architecture: x64
          - os: windows-latest
            platform: win
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder downloads the target binaries during packaging.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-yarn
        with:
          project: desktop-workbench
          node-version: "22"
      - name: Check Desktop and renderer
        working-directory: desktop-workbench
        run: |
          corepack yarn test:main
          corepack yarn renderer:typecheck
          corepack yarn workspace agents-anywhere-desktop-renderer protocol:check
          corepack yarn workspace agents-anywhere-desktop-renderer exec node --test test/session-command-ui.test.mjs test/runtime-command-api.test.mjs test/session-message-queue.test.mjs test/workspace-file-browser-dialog.test.mjs test/runtime-readiness.test.mjs test/runtime-readiness-ui.test.mjs test/desktop-update-ui.test.mjs
      - name: Cache native dependencies from the official GitHub Release API
        working-directory: desktop-workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cache-native-dependencies.mjs ${{ matrix.platform }}
      - name: Build with the official native packaging script
        working-directory: desktop-workbench
        env:
          WORKBENCH_ELECTRON_DIST: .cache/electron
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if corepack yarn dist:${{ matrix.platform }} --${{ matrix.architecture }}; then
              exit 0
            fi
          done
          exit 1
      - name: Check installer output
        shell: bash
        working-directory: desktop-workbench
        run: |
          node --input-type=module -e '
            import { readdirSync, statSync, readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const extension = process.platform === "win32" ? ".exe" : ".dmg";
            const files = readdirSync("release").filter(name => (name.endsWith(extension) || name.endsWith(".pkg")));
            if (!files.length) throw new Error(`No ${extension} installer produced`);
            const checksums = files.map(name => {
              const path = `release/${name}`;
              if (!statSync(path).size) throw new Error(`Empty installer: ${name}`);
              return `${createHash("sha256").update(readFileSync(path)).digest("hex")}  ${name}`;
            });
            writeFileSync("release/SHA256SUMS.txt", checksums.join("\n") + "\n");
          '
      - name: Keep test installers for review
        uses: actions/upload-artifact@v4
        with:
          name: fork-test-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            desktop-workbench/release/*.dmg
            desktop-workbench/release/*.pkg
            desktop-workbench/release/*.exe
            desktop-workbench/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
