name: Fork Desktop test installers

on:
  workflow_dispatch:
    inputs:
      deliver_run:
        description: Optional successful build run to deliver without rebuilding
        required: false
      deliver_tag:
        description: Existing unpublished draft tag for delivery
        required: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.deliver_run == ''
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac
            architecture: x64
          - os: windows-latest
            platform: win
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder downloads the target binaries during packaging.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-yarn
        with:
          project: desktop-workbench
          node-version: "22"
      - name: Check Desktop and renderer
        working-directory: desktop-workbench
        run: |
          corepack yarn test:main
          corepack yarn renderer:typecheck
          corepack yarn workspace agents-anywhere-desktop-renderer protocol:check
          corepack yarn workspace agents-anywhere-desktop-renderer exec node --test test/session-command-ui.test.mjs test/runtime-command-api.test.mjs test/session-message-queue.test.mjs test/workspace-file-browser-dialog.test.mjs test/runtime-readiness.test.mjs test/runtime-readiness-ui.test.mjs test/desktop-update-ui.test.mjs test/task-groups-ui.test.mjs test/forward-command.test.mjs
      - name: Cache native dependencies from the official GitHub Release API
        working-directory: desktop-workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cache-native-dependencies.mjs ${{ matrix.platform }}
      - name: Build with the official native packaging script
        working-directory: desktop-workbench
        env:
          WORKBENCH_ELECTRON_DIST: .cache/electron
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if corepack yarn dist:${{ matrix.platform }} --${{ matrix.architecture }}; then
              exit 0
            fi
          done
          exit 1
      - name: Check installer output
        shell: bash
        working-directory: desktop-workbench
        run: |
          node --input-type=module -e '
            import { readdirSync, statSync, readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const extension = process.platform === "win32" ? ".exe" : ".dmg";
            const files = readdirSync("release").filter(name => (name.endsWith(extension) || name.endsWith(".pkg")));
            if (!files.length) throw new Error(`No ${extension} installer produced`);
            const checksums = files.map(name => {
              const path = `release/${name}`;
              if (!statSync(path).size) throw new Error(`Empty installer: ${name}`);
              return `${createHash("sha256").update(readFileSync(path)).digest("hex")}  ${name}`;
            });
            writeFileSync("release/SHA256SUMS.txt", checksums.join("\n") + "\n");
          '
      - name: Keep test installers for review
        uses: actions/upload-artifact@v4
        with:
          name: fork-test-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            desktop-workbench/release/*.dmg
            desktop-workbench/release/*.pkg
            desktop-workbench/release/*.exe
            desktop-workbench/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  deliver:
    if: inputs.deliver_run != ''
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.deliver_run }}
      RELEASE_TAG: ${{ inputs.deliver_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify build, installer checksums and draft assets
        shell: python
        run: |
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          repo = os.environ['GH_REPO']
          run_id, tag = os.environ['BUILD_RUN_ID'], os.environ['RELEASE_TAG']
          assert run_id.isdigit()
          match = re.fullmatch(r'v(\d+\.\d+\.\d+)-fork', tag)
          assert match
          version = match[1]
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          build = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}'))
          assert build['conclusion'] == 'success'
          assert build['head_repository']['full_name'] == repo
          assert build['path'] == '.github/workflows/fork-desktop-build.yml'
          release = next(row for row in json.loads(gh('api', f'repos/{repo}/releases?per_page=100')) if row['tag_name'] == tag)
          assert release['draft'], 'Only an unpublished draft may be changed'
          assert release['target_commitish'] == build['head_sha']
          verified = []
          for platform, extensions in [('win', {'.exe'}), ('mac', {'.dmg', '.pkg'})]:
              directory = Path('installers') / platform
              gh('run', 'download', run_id, '--name', f'fork-test-{platform}-x64', '--dir', str(directory))
              sums = dict(line.split('  ', 1)[::-1] for line in (directory / 'SHA256SUMS.txt').read_text().splitlines())
              files = [file for file in directory.iterdir() if file.suffix in extensions]
              assert {file.suffix for file in files} == extensions
              for file in files:
                  digest = hashlib.sha256()
                  with file.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(chunk)
                  assert digest.hexdigest() == sums[file.name]
                  with file.open('rb') as stream:
                      if file.suffix == '.exe':
                          assert stream.read(2) == b'MZ'
                      elif file.suffix == '.pkg':
                          assert stream.read(4) == b'xar!'
                      else:
                          stream.seek(-512, 2)
                          assert stream.read(4) == b'koly'
                  name = f'Agents.Anywhere.Fork.Setup.{version}.exe' if file.suffix == '.exe' else f'Agents.Anywhere.Fork-{version}-x64{file.suffix}'
                  target = file.with_name(name)
                  file.rename(target)
                  gh('release', 'upload', tag, str(target), '--clobber')
                  verified.append({'name': name, 'size': target.stat().st_size, 'sha256': digest.hexdigest(), 'run': run_id})
          assets = {row['name']: row for row in json.loads(gh('api', f"repos/{repo}/releases/{release['id']}"))['assets']}
          for row in verified:
              assert assets[row['name']]['digest'] == 'sha256:' + row['sha256']
              assert assets[row['name']]['size'] == row['size']
          Path('desktop-delivery-verification.json').write_text(json.dumps(verified, indent=2))
          print(json.dumps({'draft': True, 'source': build['head_sha'], 'verifiedAssets': verified}))
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-delivery-verification
          path: desktop-delivery-verification.json
          if-no-files-found: error
