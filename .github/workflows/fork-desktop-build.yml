name: Fork Desktop test installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            architecture: arm64
          - os: windows-latest
            platform: win
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-yarn
        with:
          project: desktop-workbench
          node-version: "22"
      - name: Check Desktop and renderer
        working-directory: desktop-workbench
        run: |
          corepack yarn test:main
          corepack yarn renderer:typecheck
          corepack yarn workspace agents-anywhere-desktop-renderer protocol:check
      - name: Build with the official native packaging script
        working-directory: desktop-workbench
        run: corepack yarn dist:${{ matrix.platform }} --${{ matrix.architecture }}
      - name: Keep test installers for review
        uses: actions/upload-artifact@v4
        with:
          name: fork-p1-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            desktop-workbench/release/*.dmg
            desktop-workbench/release/*.exe
          if-no-files-found: error
          retention-days: 14
