name: Fork Android APK
on:
  workflow_dispatch:
  push:
    branches: ['feat/**']
    paths: ['android/**', '.github/workflows/fork-android-build.yml']
concurrency:
  group: fork-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Tests and unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fork-android-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-android-test-results
          path: android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
